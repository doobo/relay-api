  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#2a2f3a" stroke-width="1.5"/>
  <g stroke="#4f8cff" stroke-width="2.4" stroke-linecap="round" fill="none">
